name: Construir APK Matibatidos RC6 + Firebase

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - principal

permissions:
  contents: read

concurrency:
  group: matibatidos-rc6-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK Matibatidos RC6
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Descargar el repositorio
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # 2. Configurar Java 17 sin caché
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      # 3. Verificar y extraer el proyecto RC6
      - name: Verificar y extraer proyecto RC6
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Matibatidos_RC6_EXCEL_RENDIMIENTO_CORREGIDO_FIREBASE.zip"
          PROJECT_DIR="$RUNNER_TEMP/matibatidos-rc6"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::No se encontró $ZIP_FILE en la raíz del repositorio."
            echo "Archivos disponibles:"
            ls -la
            exit 1
          fi

          unzip -t "$ZIP_FILE"

          rm -rf "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR"

          unzip -q "$ZIP_FILE" -d "$PROJECT_DIR"

          # Comprobar estructura del proyecto
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/google-services.json"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Proyecto extraído correctamente."
          find "$PROJECT_DIR" -maxdepth 2 -type f | head -60

      # 4. Comprobar configuración de Firebase y Gradle
      - name: Validar configuración del proyecto
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path(__import__("os").environ["PROJECT_DIR"])

          config = root / "app/google-services.json"
          with config.open(encoding="utf-8") as f:
              data = json.load(f)

          expected_package = "com.matibatidos.pos.rc6"

          clients = data.get("client", [])
          packages = [
              c.get("client_info", {})
               .get("android_client_info", {})
               .get("package_name")
              for c in clients
          ]

          if expected_package not in packages:
              raise SystemExit(
                  "ERROR: google-services.json no contiene el paquete "
                  + expected_package
              )

          print("Firebase: paquete Android correcto.")
          PY

          grep -q "com.matibatidos.pos.rc6" "$PROJECT_DIR/app/build.gradle"
          grep -q "com.google.gms.google-services" "$PROJECT_DIR/build.gradle"
          grep -q "com.google.gms.google-services" "$PROJECT_DIR/app/build.gradle"
          grep -q "firebase-messaging" "$PROJECT_DIR/app/build.gradle"

          echo "Configuración Gradle y Firebase validada."

      # 5. Preparar recursos utilizados por la aplicación
      - name: Preparar bibliotecas web
        shell: bash
        run: |
          set -euo pipefail

          ASSETS="$PROJECT_DIR/app/src/main/assets"
          mkdir -p "$ASSETS"

          curl -fL --retry 3 \
            https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js \
            -o "$ASSETS/xlsx.full.min.js"

          curl -fL --retry 3 \
            https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js \
            -o "$ASSETS/chart.umd.min.js"

          test -s "$ASSETS/xlsx.full.min.js"
          test -s "$ASSETS/chart.umd.min.js"

          echo "Bibliotecas descargadas correctamente."

      # 6. Configurar Android SDK
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null || true

      # 7. Configurar Gradle 8.9 sin caché
      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Verificar Gradle
        run: gradle --version

      # 8. Compilar aplicación
      - name: Compilar APK RC6
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon --stacktrace clean assembleDebug

      # 9. Verificar APK generado
      - name: Verificar APK
        id: apk
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::No se generó el APK esperado."
            exit 1
          fi

          echo "APK generado correctamente."
          ls -lh "$APK"

          SHA256=$(sha256sum "$APK" | awk '{print $1}')
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

          echo "SHA256: $SHA256"

      # 10. Publicar APK para descargar
      - name: Publicar APK Matibatidos
        uses: actions/upload-artifact@v4
        with:
          name: Matibatidos-POS-RC6-DELIVERY-MENU-FCM-1.2.4
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Resultado de compilación
        run: |
          echo "Compilación finalizada."
          echo "Java: 17"
          echo "Gradle: 8.9"
          echo "Firebase: integrado en el proyecto"
          echo "SHA256: ${{ steps.apk.outputs.sha256 }}"
