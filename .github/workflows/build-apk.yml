name: Construir APK Matibatidos RC6 + Firebase

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - principal

permissions:
  contents: read

concurrency:
  group: matibatidos-rc6-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK Matibatidos RC6
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # 1. Descargar repositorio
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # 2. Configurar Java 17
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      # 3. Verificar y extraer proyecto RC6
      - name: Verificar y extraer proyecto RC6
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Matibatidos_RC6_EXCEL_RENDIMIENTO_CORREGIDO_FIREBASE.zip"
          PROJECT_DIR="$RUNNER_TEMP/matibatidos-rc6"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::No se encontró $ZIP_FILE en la raíz del repositorio."
            ls -la
            exit 1
          fi

          unzip -t "$ZIP_FILE"

          rm -rf "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR"
          unzip -q "$ZIP_FILE" -d "$PROJECT_DIR"

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/google-services.json"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Proyecto RC6 extraído correctamente."

      # 4. Validar Firebase y Gradle
      - name: Validar configuración del proyecto
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])
          config = root / "app/google-services.json"

          with config.open(encoding="utf-8") as f:
              data = json.load(f)

          expected = "com.matibatidos.pos.rc6"

          packages = [
              c.get("client_info", {})
               .get("android_client_info", {})
               .get("package_name")
              for c in data.get("client", [])
          ]

          if expected not in packages:
              raise SystemExit(
                  "ERROR: El paquete de Firebase no coincide: "
                  + expected
              )

          print("Firebase: paquete correcto.")
          PY

          grep -q "com.matibatidos.pos.rc6" "$PROJECT_DIR/app/build.gradle"
          grep -q "com.google.gms.google-services" "$PROJECT_DIR/build.gradle"
          grep -q "com.google.gms.google-services" "$PROJECT_DIR/app/build.gradle"
          grep -q "firebase-messaging" "$PROJECT_DIR/app/build.gradle"

          echo "Configuración del proyecto validada."

      # 5. Preparar bibliotecas web
      - name: Preparar bibliotecas web
        shell: bash
        run: |
          set -euo pipefail

          ASSETS="$PROJECT_DIR/app/src/main/assets"
          mkdir -p "$ASSETS"

          curl -fL --retry 3 \
            https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js \
            -o "$ASSETS/xlsx.full.min.js"

          curl -fL --retry 3 \
            https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js \
            -o "$ASSETS/chart.umd.min.js"

          test -s "$ASSETS/xlsx.full.min.js"
          test -s "$ASSETS/chart.umd.min.js"

      # 6. Configurar SDK Android manualmente
      - name: Configurar SDK Android
        shell: bash
        run: |
          set -euo pipefail

          SDK="$ANDROID_SDK_ROOT"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::No se encontró sdkmanager en $SDKMANAGER"
            find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager
            exit 1
          fi

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          "$SDKMANAGER" --version

          echo "Android SDK encontrado correctamente."

      # 7. Aceptar licencias e instalar componentes
      - name: Instalar componentes Android
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Componentes Android instalados."

      # 8. Configurar Gradle 8.9 sin caché
      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Verificar Gradle
        run: gradle --version

      # 9. Compilar APK
      - name: Compilar APK Matibatidos RC6
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon --stacktrace clean assembleDebug

      # 10. Verificar APK
      - name: Verificar APK generado
        id: apk
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::No se generó el APK."
            exit 1
          fi

          ls -lh "$APK"

          SHA256=$(sha256sum "$APK" | awk '{print $1}')
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

          echo "APK verificado correctamente."
          echo "SHA256: $SHA256"

      # 11. Publicar APK
      - name: Publicar APK Matibatidos
        uses: actions/upload-artifact@v4
        with:
          name: Matibatidos-POS-RC6-DELIVERY-MENU-FCM-1.2.4
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # 12. Resultado
      - name: Resultado de compilación
        run: |
          echo "Compilación finalizada."
          echo "Java: 17"
          echo "Gradle: 8.9"
          echo "Android SDK: API 35"
          echo "Firebase: configuración verificada."
          echo "SHA256: ${{ steps.apk.outputs.sha256 }}"
