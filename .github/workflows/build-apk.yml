name: Construir APK Matibatidos RC6 + Firebase

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - principal

permissions:
  contents: read

concurrency:
  group: matibatidos-rc6-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK RC6 con Firebase FCM
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verificar ZIP de Matibatidos
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Matibatidos_RC6_EXCEL_RENDIMIENTO_CORREGIDO_FIREBASE.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::No se encontró $ZIP en la raíz del repositorio. Sube el ZIP completo sin extraerlo."
            echo "Archivos presentes en la raíz:"
            ls -la
            exit 1
          fi

          unzip -t "$ZIP"
          mkdir -p "$RUNNER_TEMP/matibatidos-rc6"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/matibatidos-rc6"

          PROJECT_DIR="$RUNNER_TEMP/matibatidos-rc6"
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"
          test -f "$PROJECT_DIR/app/google-services.json"
          test -f "$PROJECT_DIR/app/src/main/java/com/matibatidos/pos/rc6/MainActivity.java"
          test -f "$PROJECT_DIR/app/src/main/java/com/matibatidos/pos/rc6/MatibatidosFirebaseMessagingService.java"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "ZIP validado y proyecto extraído."

      - name: Validar Firebase y paquete Android
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          cfg = json.loads(Path("app/google-services.json").read_text(encoding="utf-8"))
          clients = cfg.get("client", [])
          expected = "com.matibatidos.pos.rc6"
          packages = [
              c.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for c in clients
          ]
          if expected not in packages:
              raise SystemExit(
                  f"google-services.json no contiene el paquete esperado {expected}. "
                  f"Paquetes encontrados: {packages}"
              )
          print("Firebase válido para:", expected)
          PY

          grep -Eq "applicationId[[:space:]]+['\"]com\.matibatidos\.pos\.rc6['\"]" app/build.gradle
          grep -q "com.google.gms.google-services" build.gradle
          grep -q "com.google.gms.google-services" app/build.gradle
          grep -q "firebase-messaging" app/build.gradle
          grep -q "com.google.firebase.MESSAGING_EVENT" app/src/main/AndroidManifest.xml
          echo "Configuración Firebase y applicationId verificados."

      - name: Incluir bibliotecas locales para Excel y gráficos
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="app/src/main/assets"
          mkdir -p "$ASSETS"

          curl --fail --show-error --location --retry 3 --retry-delay 2 \
            "https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" \
            --output "$ASSETS/xlsx.full.min.js"

          curl --fail --show-error --location --retry 3 --retry-delay 2 \
            "https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" \
            --output "$ASSETS/chart.umd.min.js"

          test -s "$ASSETS/xlsx.full.min.js"
          test -s "$ASSETS/chart.umd.min.js"
          echo "Bibliotecas Excel y gráficos descargadas correctamente."

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma y herramientas Android
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK debug
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verificar APK generada
        id: apk
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::Gradle terminó sin producir $APK."
            find app/build/outputs -maxdepth 6 -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "APK generada:"
          ls -lh "$APK"
          sha256sum "$APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Publicar APK RC6 con Firebase
        uses: actions/upload-artifact@v4
        with:
          name: Matibatidos-POS-RC6-DELIVERY-MENU-FCM-1.2.4
          path: ${{ steps.source.outputs.project_dir }}/${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
